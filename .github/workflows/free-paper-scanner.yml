name: Free paper scanner

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: free-paper-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Check out scanner
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify paper-only safety
        run: python -m pytest -q

      - name: Run paper scanner window
        shell: bash
        run: |
          set +e
          timeout --signal=INT --kill-after=30s 330m \
            python run_with_dashboard.py --dry-run --port 8888
          scanner_exit=$?
          set -e
          if [[ "$scanner_exit" -ne 0 && "$scanner_exit" -ne 124 && "$scanner_exit" -ne 130 ]]; then
            exit "$scanner_exit"
          fi

      - name: Save paper-scan logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-scan-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
